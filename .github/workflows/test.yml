name: SudokuFunny regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sudoku:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test puzzle uniqueness, game safety and PWA
        run: node tests/sudoku.cjs
      - name: Install browser harness
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Test Sudoku in Android-sized Chromium
        run: node tests/browser.cjs
